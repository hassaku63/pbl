[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-backlog"
dynamic = ["version"]
description = "Backlog API v2 wrapper"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hassaku63", email = "11898511+hassaku63@users.noreply.github.com" }]
keywords = ["nulab", "backlog"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: Japanese",
    "Natural Language :: English",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "coverage>=7.6",
]

[project.urls]
Homepage = "https://github.com/hassaku63/pbl"
Source = "https://github.com/hassaku63/pbl"
Issues = "https://github.com/hassaku63/pbl/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["backlog*"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, C90: mccabe (the previous flake8 setup), B: flake8-bugbear
select = ["E", "W", "F", "C90", "B"]

[tool.ruff.lint.mccabe]
max-complexity = 10
