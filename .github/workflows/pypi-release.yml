name: Release

# Releases are driven by the VERSION file:
# - A push to master whose VERSION has no matching "v<VERSION>" tag yet builds the package,
#   publishes it to PyPI, then creates the tag and a GitHub Release on that commit.
# - workflow_dispatch does the same for a given commit on master (e.g. to release an older commit).
# - Pull requests only build the package.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit (or branch) on master to release"
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      release: ${{ steps.release.outputs.release }}
      latest: ${{ steps.release.outputs.latest }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
        fetch-depth: 0  # tags and master history are needed to decide whether to release
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.x"
    - name: Decide whether to release
      id: release
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        version=$(tr -d '[:space:]' < VERSION)
        if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::Invalid VERSION: $version"
          exit 1
        fi
        sha=$(git rev-parse HEAD)

        release=true
        if [ "$EVENT_NAME" = "pull_request" ] || [ "$REF" != "refs/heads/master" ]; then
          release=false
        elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
          echo "Tag v$version already exists; nothing to release."
          release=false
        elif ! git merge-base --is-ancestor "$sha" origin/master; then
          echo "::error::$sha is not on master"
          exit 1
        fi

        highest=$( (git tag --list 'v*' | sed 's/^v//'; echo "$version") | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
        latest=false
        [ "$highest" = "$version" ] && latest=true

        {
          echo "version=$version"
          echo "sha=$sha"
          echo "release=$release"
          echo "latest=$latest"
        } >> "$GITHUB_OUTPUT"
        echo "version=$version sha=$sha release=$release latest=$latest"
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Check the built version
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        ls dist/
        ls "dist/python_backlog-$VERSION.tar.gz" "dist/python_backlog-$VERSION-py3-none-any.whl"
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: needs.build.outputs.release == 'true'
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-backlog
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        # Make re-runs safe: if a previous run published to PyPI but failed to create the tag or
        # GitHub Release, re-running (or the next push to master) skips the upload and finishes the release.
        skip-existing: true
        # The action defaults to verbose output, which dumps the whole attestation and transparency
        # log exchange. It is all public data, but it makes the log hard to read.
        verbose: false

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and create the tag and GitHub Release
    needs:
    - build
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create the tag and GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.build.outputs.version }}
        SHA: ${{ needs.build.outputs.sha }}
        LATEST: ${{ needs.build.outputs.latest }}
      # `gh release create` creates the tag on the target commit.
      # dist/ contains the built packages and the sigstore-produced bundles.
      run: >-
        gh release create "v$VERSION" dist/*
        --repo "$GITHUB_REPOSITORY"
        --target "$SHA"
        --title "v$VERSION"
        --generate-notes
        --latest="$LATEST"
